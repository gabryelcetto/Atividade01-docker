services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - rede_equipamentos
    healthcheck:
      # "-h localhost" faz o mysqladmin conectar pelo socket Unix local, que já
      # responde durante o servidor temporário que o MySQL sobe só pra rodar os
      # scripts de init (schema/seed) — isso marcava o container como "healthy"
      # antes do servidor definitivo estar escutando em 3306, e o `web` subia
      # cedo demais e falhava ao conectar. Forçar TCP na porta 3306 garante que
      # o healthcheck só passa quando o MySQL real (não o temporário) está pronto.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "--protocol=TCP", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_equipamentos

networks:
  rede_equipamentos:
    driver: bridge

volumes:
  db_data:
  uploads_data:
